name: Android CI

# push할 때마다 빌드하고, 고정 키로 서명한 디버그 APK를 GitHub 릴리스 dev-latest로 배포한다.
# 설치 링크: https://github.com/<저장소>/releases/download/dev-latest/piggybank.apk
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# dev-latest 릴리스를 지우고 다시 만드는 작업이 겹치지 않도록 한 번에 하나씩 실행한다.
concurrency:
  group: android-ci
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 캐시 + gradle-wrapper.jar 무결성 검증
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"
            echo "서명 키 복원 완료"
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 Secret이 없어 임시 키로 빌드하고 배포하지 않습니다."
          fi

      - name: Unit test, lint, build debug APK
        shell: bash
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebug --continue 2>&1 | tee build.log

      # 실패했을 때 긴 로그 대신 오류 줄만 모아서 보여준다.
      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |FAILED|^\s+(java|org)\.\S+(Error|Exception)|error:|Errors found" build.log | head -150 || true

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk piggybank.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: piggybank-apk
          path: piggybank.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Publish dev-latest release
        if: github.event_name != 'pull_request' && env.SIGNING_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "versionCode: $GITHUB_RUN_NUMBER"
            git log -1 --pretty=%B
          } > release-notes.txt
          gh release delete dev-latest --cleanup-tag --yes || true
          gh release create dev-latest piggybank.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "개발 버전 (빌드 #$GITHUB_RUN_NUMBER)" \
            --notes-file release-notes.txt

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.jks"
